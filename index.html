<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCLR - Inicio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>BCLR</h1>
            <nav>
                <a href="index.html">inicio</a>
                <a href="sobre.html">Sobre</a>
                <a href="contato.html">Contato</a>
                <a href="carrinho.html" id="link-carrinho">Carrinho (0)</a>
                <a href="login.html" id="link-login">Entrar</a>
                <a href="admin.html" id="link-admin" style="display: none;">Admin</a>
                <button id="btn-sair" style="display: none;" onclick="fazerLogout()">Sair</button>
            </nav>
        </div>
    </header>

    <main>
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Destaques da Semana</h2>
        <div id="product-grid" class="grid">
            <p>Carregando produtos...</p>
        </div>
    </main>

    <footer><p>&copy; 2026 Loja. Todos os direitos reservados.</p></footer>

    <script src="app.js"></script>
    <script>
        function exibirProdutos(grid, dados, mensagemVazia) {
            if (dados.length === 0) {
                grid.innerHTML = `<p>${mensagemVazia}</p>`;
                return;
            }

            grid.innerHTML = dados.map(p => {
                const medidaTexto = formatarMedida(p.medida);
                const opcoesTamanho = Array.isArray(p.medida)
                    ? `<div class="seletor-tamanhos" aria-label="Escolha o tamanho">${p.medida.map(tamanho => `<button class="botao-tamanho" type="button" onclick="selecionarTamanho(this)">${tamanho}</button>`).join('')}</div>`
                    : `<p>Medida: 1 ${medidaTexto}</p>`;

                return `
                    <div class="card">
                        <img class="${p.descricao === 'Tênis BMW Motorsport' ? 'imagem-completa' : ''}" src="${p.imagem_url}" alt="${p.descricao}" onerror="this.src='./jaqueta.jpg'">
                        <h2>${p.descricao}</h2>
                        ${Array.isArray(p.medida) ? `<p>Escolha o tamanho:</p>${opcoesTamanho}` : opcoesTamanho}
                        <div class="preco">R$ ${p.preco.toFixed(2)}</div>
                        <button class="btn-acao" onclick="adicionarProdutoDoCard(this)" data-produto-id="${p.id}">Adicionar</button>
                    </div>
                `;
            }).join('');
        }

        function selecionarTamanho(botao) {
            const seletor = botao.closest('.seletor-tamanhos');
            seletor.querySelectorAll('.botao-tamanho').forEach(opcao => {
                opcao.classList.toggle('selecionado', opcao === botao);
                opcao.setAttribute('aria-pressed', opcao === botao ? 'true' : 'false');
            });
        }

        function adicionarProdutoDoCard(botao) {
            const produto = MockDB.selecionar('produtos', p => p.id === botao.dataset.produtoId)[0];
            const seletor = botao.closest('.card').querySelector('.seletor-tamanhos');
            const opcaoSelecionada = seletor && seletor.querySelector('.botao-tamanho.selecionado');

            if (Array.isArray(produto.medida) && !opcaoSelecionada) {
                alert('Escolha um tamanho para a jaqueta.');
                return;
            }

            const medida = opcaoSelecionada ? opcaoSelecionada.textContent : produto.medida;
            adicionarAoCarrinho(produto.id, produto.descricao, produto.preco, medida, produto.imagem_url);
        }

        function carregarDestaques() {
            const grid = document.getElementById('product-grid');
            // Simula: SELECT * FROM produtos WHERE destaque = true
            const dados = MockDB.selecionar('produtos', p => p.destaque === true);
            exibirProdutos(grid, dados, 'Nenhum produto em destaque ou banco de dados vazio.');
        }

        document.addEventListener('DOMContentLoaded', carregarDestaques);
    </script>
</body>
</html>
